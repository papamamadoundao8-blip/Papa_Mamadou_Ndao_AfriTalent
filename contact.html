   <button id="retourverslehaut">Retour en haut</button>
   <main class="dContact">
      <div class="container-fluid contacts">
         <div class="mescontact mt-5 pt-5">
            <h1 class="text-light">Envoyez un message</h1>
            <form>
               <div class="group">
                  <label for="nom">Nom</label>
                  <input type="text" id="nom" name="last-name" placeholder="Votre nom">
               </div>
               <div class="group">
                  <label for="prenom">Prénom</label>
                  <input type="text" id="prenom" placeholder="Votre prénom">
               </div>
               <div class="group">
                  <label for="email">Email</label>
                  <input type="email" id="email" name="email" placeholder="Donnez votre email">
               </div>
               <div class="group">
                  <label for="subject">Sujet</label>
                  <select id="subject" name="subject">
                     <option value="" class="text-light">Sélectionnez un sujet</option>
                     <option value="support">Je suis freelance</option>
                     <option value="sales">Je cherche un freelance</option>
                     <option value="other">Autre</option>
                  </select>
               </div>
               <div class="group">
                  <label for="message">Message</label>
                  <textarea id="message" name="message" placeholder="Minimum 20 caractéres"></textarea>
               </div>
               <div class="d-flex justify-content-center gap-4">
                  <button type="submit" class="btn btn-primary" id="btnEnvoyer">Envoyer</button>
                  <button type="reset" class="btn btn-outline-primary" id="btnAnnuler">Annuler</button>
               </div>
            </form>
         </div>
         <div class="mt-5 pt-5">
            <div>
               <h2 class="text-light">Nos coordonnées</h2>
               <p class="text-light"><strong>Email :</strong> contact@AfriTalent.com</p>
               <p class="text-light"><strong>Téléphone :</strong> +223 123 45 67</p>
               <p class="text-light"><strong>Adresse :</strong> 14 Rue Mobutu Maduéké, 65000 Yamoussouko</p>
            </div>

            <div>
               <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d14595.7478332501!2d-17.450970235227974!3d14.700131441579636!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2ssn!4v1776953668284!5m2!1sfr!2ssn"
                  style="width: 100%;" height="250" class="border-2 border-dark">
               </iframe>
            </div>
         </div>
      </div>
   </main>
